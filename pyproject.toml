[tool.poetry]
name = "peopledatalabs"
version = "7.0.0"
description = "Official Python client for the People Data Labs API"
homepage = "https://www.peopledatalabs.com"
repository = "https://github.com/peopledatalabs/peopledatalabs-python"
documentation = "https://docs.peopledatalabs.com"
keywords = [
  "data enrichment",
  "people data labs",
  "person enrichment",
  "company enrichment",
  "search",
]
authors = ["People Data Labs <hello@peopledatalabs.com>"]
readme = "README.md"
license = "MIT License"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/peopledatalabs/peopledatalabs-python/issues"
"Source Code" = 'https://github.com/peopledatalabs/peopledatalabs-python'

[tool.poetry.dependencies]
python = "^3.10"
email-validator = ">=1.1,<3.0"
pydantic = "^2"
requests = "^2"

[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
coverage = "^7.6.1"
pytest = "^8.3.5"
ruff = "^0.15.15"
pre-commit = "^4.6.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
log_cli_format = """ \
  %(asctime)s \
  %(name)s \
  [%(levelname)8s] \
  %(message)s \
  (%(filename)s:\
  %(lineno)s)
"""
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.black]
line-length = 79
[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 79
indent-width = 4

# Assume Python 3.10
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Also enable:
# - I: isort
# - UP: pyupgrade
# - B: flake8-bugbear
# - SIM: flake8-simplify
# - PL: Pylint
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "PL", "W"]
ignore = ["PLR2004", "SLF001"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_[a-zA-Z0-9_]*[a-zA-Z0-9]+?$)|dummy|^ignored_|^unused_)"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code examples in
# docstrings.
#
# This field is only used if `docstring-code-format` is enabled.
docstring-code-line-length = "dynamic"
